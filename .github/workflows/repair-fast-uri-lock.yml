name: Repair fast-uri lock

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/repair-fast-uri-lock.yml

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/5d-release-hardening'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Generate patched lockfile
        shell: bash
        run: |
          set -euo pipefail
          cp backend/package-lock.json /tmp/backend-package-lock.before.json
          npm --prefix backend audit fix --package-lock-only --omit=dev

      - name: Prove only the two fast-uri entries changed
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const before = JSON.parse(fs.readFileSync('/tmp/backend-package-lock.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('backend/package-lock.json', 'utf8'));
          const allowed = new Set([
            'node_modules/fast-uri',
            'node_modules/fast-json-stringify/node_modules/fast-uri',
          ]);

          assert.deepEqual(Object.keys(after).sort(), Object.keys(before).sort());
          for (const key of Object.keys(before)) {
            if (key !== 'packages') assert.deepEqual(after[key], before[key], `top-level lock field changed: ${key}`);
          }

          assert.deepEqual(Object.keys(after.packages).sort(), Object.keys(before.packages).sort());
          const changed = [];
          for (const key of Object.keys(before.packages)) {
            if (JSON.stringify(before.packages[key]) !== JSON.stringify(after.packages[key])) changed.push(key);
            if (!allowed.has(key)) assert.deepEqual(after.packages[key], before.packages[key], `unexpected package change: ${key}`);
          }
          assert.deepEqual(changed.sort(), [...allowed].sort());
          assert.equal(after.packages['node_modules/fast-uri'].version, '3.1.5');
          assert.equal(after.packages['node_modules/fast-json-stringify/node_modules/fast-uri'].version, '4.1.2');
          console.log('LOCK_REPAIR_SCOPE_OK');
          NODE

      - name: Verify install and runtime audit
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix backend ci
          npm --prefix backend audit --omit=dev --audit-level=high

      - name: Commit generated lockfile to the PR branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package-lock.json
          git diff --cached --quiet && { echo 'Expected a lockfile repair but found no diff'; exit 1; }
          git commit -m 'fix: patch fast-uri runtime advisory'
          git push origin "HEAD:${HEAD_REF}"
