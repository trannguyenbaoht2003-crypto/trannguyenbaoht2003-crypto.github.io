name: Diagnose inherited stale lock test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/diagnose-backend-stale-lock.yml"

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate test and lock implementation
        shell: bash
        run: |
          set -euo pipefail
          echo '=== backend test files ==='
          find backend/test -type f -name '*.test.ts' -print | sort
          echo '=== broad stale-lock matches ==='
          grep -RIn --exclude-dir=node_modules -E 'stale|outage|overlap|activeAttempts|active attempts|lockDuration|lockRenewTime|stalledInterval|retryable_failed|content-update|content update' backend/test backend/src | head -500 || true
