name: Sprint 5C frontend and backend regression gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "backend/**"
      - "deploy/**"
      - "scripts/staging-smoke.mjs"
      - "scripts/production-smoke.mjs"
      - "scripts/production-browser-smoke.mjs"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "README.md"
      - ".github/workflows/backend-production-foundation.yml"
      - ".github/workflows/sprint-5c-staging-integration.yml"
      - ".github/workflows/production-release-gate.yml"
      - "docs/adr/**"
      - "docs/runbooks/**"
      - "docs/superpowers/**"

permissions:
  contents: read

concurrency:
  group: sprint-5c-frontend-backend-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify frontend and backend regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hai_dau_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hai_dau_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hai_dau_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Root orchestration and runbook contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const rootPackage = JSON.parse(await readFile("package.json", "utf8"));
          const expectedScripts = {
            "test:public-data": "node --experimental-strip-types --test tests/public-data-adapter.test.ts",
            "test:staging-contract": "node --test tests/staging-deployment.test.mjs",
            "staging:config": "docker compose --env-file deploy/staging/.env.example -f deploy/staging/compose.yml config",
            "staging:up": "docker compose --env-file deploy/staging/.env.example -f deploy/staging/compose.yml up --build -d --wait",
            "staging:smoke": "node scripts/staging-smoke.mjs",
            "staging:down": "docker compose --env-file deploy/staging/.env.example -f deploy/staging/compose.yml down -v --remove-orphans",
            "backend:typecheck": "npm --prefix backend run typecheck",
            "backend:test": "npm --prefix backend test",
            "backend:build": "npm --prefix backend run build",
          };
          for (const [name, command] of Object.entries(expectedScripts)) {
            if (rootPackage.scripts?.[name] !== command) {
              throw new Error(`missing root orchestration script ${name}`);
            }
          }

          const backendRunbook = await readFile("backend/README.md", "utf8");
          for (const contract of [
            "PostgreSQL 17",
            "Redis 7",
            "TEST_DATABASE_URL",
            "TEST_REDIS_URL",
            "reference_only",
            "retryable_failed",
            "No production credentials",
            "CatalogSnapshotV1",
            "catalog_import",
            "CATALOG_ACTIVE_POINTER_CONFLICT",
            "CATALOG_REVISION_NOT_ACTIVE",
            "No external catalog fetch",
            "ObservationNormalizationSnapshotV1",
            "Fingerprint exclusions",
            "Candidate identity",
            "CandidateRevision identity",
            "Provenance chain",
            "Scenario S1",
            "Scenario S12",
            "Scenario S21",
            "reference_only cannot supply a stored aggregate snapshot",
            "Claim-level Evidence",
            "Candidate claim-set seal",
            "Evidence input snapshot",
            "Evidence decision history",
            "Cross-patch revalidation",
            "Human Review input snapshot",
            "completed + confirmed",
            "Review quorum",
            "Candidate → CandidateRevision → Claim",
            "AI provenance is not Evidence",
            "Moderation decision history",
            "No default clear",
            "Eligibility input snapshot",
            "Only required Claims determine Eligibility",
            "Stale Eligibility reads needs_review",
            "Eligibility re-evaluation queue",
            "PostgreSQL remains Eligibility authority",
            "PublicationVersion immutable",
            "Publisher permission required",
            "Fresh Eligibility rechecked at commit",
            "Publication activation history",
            "Item-level rollback",
            "Public read independent from workers",
            "PostgreSQL remains Publication authority",
            "No automatic publication",
            "No HTTP mutation route",
            "No UI",
            "GET /api/v1/publications",
            "GET /api/v1/publications/:publicationId",
            "Read-only Publication HTTP boundary",
            "Public API reads PostgreSQL only",
            "No Publication mutation route",
            "No frontend integration",
            "No auth provider",
            "No merge",
            "No deploy",
          ]) {
            if (!backendRunbook.includes(contract)) {
              throw new Error(`backend runbook is missing contract: ${contract}`);
            }
          }

          const frontendRunbook = await readFile("docs/runbooks/frontend-public-data.md", "utf8");
          for (const contract of [
            "NEXT_PUBLIC_PUBLIC_API_BASE_URL",
            "same-origin",
            "one `GET /api/v1/publications` request",
            "Dữ liệu tĩnh",
            "API tạm thời không khả dụng",
            "no Publication mutation route",
            "No retry, polling, timer",
            "No automatic publication",
            "No browser token",
            "No CORS expansion",
            "No merge",
          ]) {
            if (!frontendRunbook.includes(contract)) {
              throw new Error(`frontend runbook is missing contract: ${contract}`);
            }
          }

          const stagingRunbook = await readFile("docs/runbooks/staging-environment.md", "utf8");
          for (const contract of [
            "same-origin",
            "PostgreSQL 17",
            "Redis 7",
            "backend outage",
            "application rollback",
            "forward-only",
            "No production deployment",
          ]) {
            if (!stagingRunbook.includes(contract)) {
              throw new Error(`staging runbook is missing contract: ${contract}`);
            }
          }
          NODE

      - name: Install frontend dependencies
        run: npm ci --cache /tmp/aram-root-npm-cache

      - name: Install backend dependencies
        run: npm --prefix backend ci --cache /tmp/aram-backend-npm-cache

      - name: Validate community data
        run: npm run validate:community

      - name: Frontend lint
        run: npm run lint

      - name: Frontend public-data tests
        run: npm run test:public-data

      - name: Staging source contracts
        run: npm run test:staging-contract

      - name: Frontend tests
        run: npm test

      - name: Canonical frontend Pages build
        run: npm run build:pages

      - name: Backend typecheck
        run: npm run backend:typecheck

      - name: Backend tests
        run: npm run backend:test

      - name: Backend build
        run: npm run backend:build

      - name: Runtime dependency audit
        run: npm --prefix backend audit --omit=dev --audit-level=high

      - name: Build production gateway image
        run: docker build -f deploy/production/Dockerfile.gateway -t loi-meta-gateway:pr .

      - name: Build production backend image
        run: docker build -f backend/Dockerfile -t loi-meta-backend:pr backend

      - name: Build production collector image
        run: docker build -f deploy/production/Dockerfile.collector -t loi-meta-collector:pr .

      - name: Compose configuration
        run: npm run staging:config

      - name: Repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          status="$(git status --short)"
          if [[ -n "$status" ]]; then
            echo "Generated files changed the checkout:"
            echo "$status"
            exit 1
          fi

      - name: Deployment guard
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/backend-production-foundation.yml"
          executable="$RUNNER_TEMP/sprint-5c-regression-before-guard.yml"
          sed '/- name: Deployment guard/,$d' "$workflow" > "$executable"
          ! grep -Eq '(contents|packages|pages|id-token):[[:space:]]*write' "$executable"
          ! grep -Eq 'git push|docker[[:space:]]+(login|push)|wrangler[[:space:]]+deploy|npm run deploy|actions/deploy-pages' "$executable"
          ! grep -Eq '(CLOUDFLARE_API_TOKEN|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|GOOGLE_APPLICATION_CREDENTIALS|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' "$executable"
