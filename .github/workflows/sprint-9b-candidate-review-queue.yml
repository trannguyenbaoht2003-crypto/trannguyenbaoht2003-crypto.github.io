name: Sprint 9B candidate review queue gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/src/database/queryable.ts"
      - "backend/src/modules/operator/**"
      - "backend/src/operator/**"
      - "backend/src/operator-server.ts"
      - "backend/test/operator-*.test.ts"
      - "backend/test/helpers/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "tests/operator-surface-contract.test.mjs"
      - "tests/operator-candidate-review-queue-contract.test.mjs"
      - "docs/runbooks/operator-surface.md"
      - "docs/superpowers/specs/2026-08-28-candidate-review-confidence-queue-design.md"
      - "docs/superpowers/plans/2026-08-28-candidate-review-confidence-queue.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sprint-9b-candidate-review-queue.yml"

permissions:
  contents: read

concurrency:
  group: sprint-9b-candidate-review-queue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify read-only candidate review queue
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hai_dau_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hai_dau_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hai_dau_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --cache /tmp/aram-root-npm-cache

      - name: Install backend dependencies
        run: npm --prefix backend ci --cache /tmp/aram-backend-npm-cache

      - name: Sprint 9B repository contract
        run: npm run test:operator-candidate-review-queue

      - name: Existing operator surface contract
        run: npm run test:operator-surface

      - name: Frontend lint
        run: npm run lint

      - name: Backend typecheck
        run: npm --prefix backend run typecheck

      - name: Backend tests
        run: npm --prefix backend test

      - name: Backend build
        run: npm --prefix backend run build

      - name: Repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          status="$(git status --short)"
          if [[ -n "$status" ]]; then
            echo "Generated files changed the checkout:"
            echo "$status"
            exit 1
          fi

      - name: Deployment guard
        shell: bash
        run: |
          set -euo pipefail
          workflow=".github/workflows/sprint-9b-candidate-review-queue.yml"
          executable="$RUNNER_TEMP/sprint-9b-before-guard.yml"
          sed '/- name: Deployment guard/,$d' "$workflow" > "$executable"
          ! grep -Eq '(contents|packages|pages|id-token):[[:space:]]*write' "$executable"
          ! grep -Eqi 'railway[[:space:]]+up|git[[:space:]]+push|docker[[:space:]]+(login|push)|wrangler[[:space:]]+deploy|npm run deploy|actions/deploy-pages|kubectl|terraform|pulumi' "$executable"
          ! grep -Eq '(RAILWAY_TOKEN|CLOUDFLARE_API_TOKEN|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|GOOGLE_APPLICATION_CREDENTIALS|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' "$executable"
