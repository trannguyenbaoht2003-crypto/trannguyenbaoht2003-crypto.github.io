name: Production release gate

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main commit SHA to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify:
    name: verify exact production release
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/hai_dau_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hai_dau_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hai_dau_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Validate release SHA format
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          }

      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact SHA is reachable from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          echo "production-release: exact main SHA verified"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --cache /tmp/production-root-npm-cache

      - name: Install backend dependencies
        run: npm --prefix backend ci --cache /tmp/production-backend-npm-cache

      - name: Validate community data
        run: npm run validate:community

      - name: Frontend lint
        run: npm run lint

      - name: Production source contracts
        run: npm run test:production-contract

      - name: Full frontend regression and static export
        run: npm test

      - name: Canonical frontend Pages build
        run: npm run build:pages

      - name: Backend typecheck
        run: npm run backend:typecheck

      - name: Backend tests
        run: npm run backend:test

      - name: Backend build
        run: npm run backend:build

      - name: Runtime dependency audit
        run: npm --prefix backend audit --omit=dev --audit-level=high

      - name: Build production gateway image
        run: docker build -f deploy/production/Dockerfile.gateway -t loi-meta-gateway:${RELEASE_SHA} .

      - name: Build production backend image
        run: docker build -f backend/Dockerfile -t loi-meta-backend:${RELEASE_SHA} backend

      - name: Build production collector image
        run: docker build -f deploy/production/Dockerfile.collector -t loi-meta-collector:${RELEASE_SHA} .

      - name: Repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --short)"

  deploy:
    name: deploy exact SHA to Railway production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
      RAILWAY_BACKEND_SERVICE: ${{ vars.RAILWAY_BACKEND_SERVICE }}
      RAILWAY_WORKER_SERVICE: ${{ vars.RAILWAY_WORKER_SERVICE }}
      RAILWAY_COLLECTOR_SERVICE: ${{ vars.RAILWAY_COLLECTOR_SERVICE }}
      RAILWAY_AI_AUTOMATION_SERVICE: ${{ vars.RAILWAY_AI_AUTOMATION_SERVICE }}
      RAILWAY_GATEWAY_SERVICE: ${{ vars.RAILWAY_GATEWAY_SERVICE }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}

    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-verify release SHA before deploy
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          echo "production-release: deploy SHA verified"

      - name: Validate external Railway binding
        shell: bash
        run: |
          set -euo pipefail
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_ENVIRONMENT RAILWAY_BACKEND_SERVICE RAILWAY_WORKER_SERVICE RAILWAY_COLLECTOR_SERVICE RAILWAY_AI_AUTOMATION_SERVICE RAILWAY_GATEWAY_SERVICE PRODUCTION_BASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "production-release: required Railway/GitHub binding is missing: ${name}" >&2
              exit 1
            fi
          done
          echo "production-release: external binding present"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install smoke dependencies
        run: npm ci --cache /tmp/production-deploy-npm-cache

      - name: Install pinned Railway CLI
        run: |
          npm install --global @railway/cli@5.30.1
          railway --version

      - name: Deploy backend from exact tree
        id: deploy_backend
        shell: bash
        run: |
          set -euo pipefail
          payload="$(railway up --detach --json \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_BACKEND_SERVICE" \
            --message "release ${RELEASE_SHA} backend")"
          deployment_id="$(printf '%s' "$payload" | node --input-type=module -e '
            let raw="";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              let value;
              try { value = JSON.parse(raw); } catch { process.exit(1); }
              const id = value?.deploymentId;
              if (typeof id !== "string" || id.length < 1 || id.length > 128 || !/^[A-Za-z0-9-]+$/.test(id)) process.exit(1);
              process.stdout.write(id);
            });
          ')"
          test -n "$deployment_id"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Verify backend exact deployment
        run: >-
          node scripts/verify-railway-deployment.mjs
          --mode status-only
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT"
          --service "$RAILWAY_BACKEND_SERVICE"
          --deployment-id "${{ steps.deploy_backend.outputs.deployment_id }}"

      - name: Deploy worker from exact tree
        id: deploy_worker
        shell: bash
        run: |
          set -euo pipefail
          payload="$(railway up --detach --json \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_WORKER_SERVICE" \
            --message "release ${RELEASE_SHA} worker")"
          deployment_id="$(printf '%s' "$payload" | node --input-type=module -e '
            let raw="";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              let value;
              try { value = JSON.parse(raw); } catch { process.exit(1); }
              const id = value?.deploymentId;
              if (typeof id !== "string" || id.length < 1 || id.length > 128 || !/^[A-Za-z0-9-]+$/.test(id)) process.exit(1);
              process.stdout.write(id);
            });
          ')"
          test -n "$deployment_id"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Verify worker exact deployment
        run: >-
          node scripts/verify-railway-deployment.mjs
          --mode status-only
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT"
          --service "$RAILWAY_WORKER_SERVICE"
          --deployment-id "${{ steps.deploy_worker.outputs.deployment_id }}"

      - name: Deploy collector from exact tree
        id: deploy_collector
        shell: bash
        run: |
          set -euo pipefail
          payload="$(railway up --detach --json \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_COLLECTOR_SERVICE" \
            --message "release ${RELEASE_SHA} collector")"
          deployment_id="$(printf '%s' "$payload" | node --input-type=module -e '
            let raw="";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              let value;
              try { value = JSON.parse(raw); } catch { process.exit(1); }
              const id = value?.deploymentId;
              if (typeof id !== "string" || id.length < 1 || id.length > 128 || !/^[A-Za-z0-9-]+$/.test(id)) process.exit(1);
              process.stdout.write(id);
            });
          ')"
          test -n "$deployment_id"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Verify collector exact deployment
        run: >-
          node scripts/verify-railway-deployment.mjs
          --mode status-only
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT"
          --service "$RAILWAY_COLLECTOR_SERVICE"
          --deployment-id "${{ steps.deploy_collector.outputs.deployment_id }}"

      - name: Deploy AI automation from exact tree
        id: deploy_ai_automation
        shell: bash
        run: |
          set -euo pipefail
          payload="$(railway up --detach --json \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_AI_AUTOMATION_SERVICE" \
            --message "release ${RELEASE_SHA} ai-automation")"
          deployment_id="$(printf '%s' "$payload" | node --input-type=module -e '
            let raw="";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              let value;
              try { value = JSON.parse(raw); } catch { process.exit(1); }
              const id = value?.deploymentId;
              if (typeof id !== "string" || id.length < 1 || id.length > 128 || !/^[A-Za-z0-9-]+$/.test(id)) process.exit(1);
              process.stdout.write(id);
            });
          ')"
          test -n "$deployment_id"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Verify AI automation exact disabled deployment
        run: >-
          node scripts/verify-railway-deployment.mjs
          --mode status-and-disabled-marker
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT"
          --service "$RAILWAY_AI_AUTOMATION_SERVICE"
          --deployment-id "${{ steps.deploy_ai_automation.outputs.deployment_id }}"

      - name: Deploy gateway from exact tree
        id: deploy_gateway
        shell: bash
        run: |
          set -euo pipefail
          payload="$(railway up --detach --json \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_GATEWAY_SERVICE" \
            --message "release ${RELEASE_SHA} gateway")"
          deployment_id="$(printf '%s' "$payload" | node --input-type=module -e '
            let raw="";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => raw += chunk);
            process.stdin.on("end", () => {
              let value;
              try { value = JSON.parse(raw); } catch { process.exit(1); }
              const id = value?.deploymentId;
              if (typeof id !== "string" || id.length < 1 || id.length > 128 || !/^[A-Za-z0-9-]+$/.test(id)) process.exit(1);
              process.stdout.write(id);
            });
          ')"
          test -n "$deployment_id"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Verify gateway exact deployment
        run: >-
          node scripts/verify-railway-deployment.mjs
          --mode status-only
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT"
          --service "$RAILWAY_GATEWAY_SERVICE"
          --deployment-id "${{ steps.deploy_gateway.outputs.deployment_id }}"

      - name: Production HTTP smoke
        run: npm run production:smoke

      - name: Production browser smoke
        run: npm run production:browser-smoke

      - name: Record deployed exact SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "PRODUCTION_DEPLOYED_AND_SMOKE_VERIFIED release_sha=${RELEASE_SHA}"
