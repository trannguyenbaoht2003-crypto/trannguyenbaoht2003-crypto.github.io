name: Sprint 8F verifier validation temp

on:
  pull_request:
    paths:
      - "scripts/verify-railway-deployment.mjs"
      - "tests/verify-railway-deployment.test.mjs"
      - ".github/workflows/sprint-8f-verifier-validation-temp.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - run: node --test tests/verify-railway-deployment.test.mjs
